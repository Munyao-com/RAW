<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}
<link rel="canonical" href="https://{{domain}}/{{canonical}}">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{share_title}}">
<meta property="og:description" content="{{share_description}}">
<meta property="og:image" content="https://{{domain}}/{{og_image}}">
<meta property="og:image:width" content="{{og_w}}">
<meta property="og:image:height" content="{{og_h}}">
<meta property="og:url" content="https://{{domain}}/{{canonical}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{share_title}}">
<meta name="twitter:description" content="{{share_description}}">
<meta name="twitter:image" content="https://{{domain}}/{{og_image}}">
<link rel="stylesheet" href="{{base}}css/site.css">
{{jsonld}}
</head>
<body data-page="{{page}}">
